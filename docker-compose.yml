services:
    db:
        image: postgres:16-alpine
        command: postgres -c max_connections=200
        volumes:
            - postgres_data_dev:/var/lib/postgresql/data
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build: ./backend
        command: uv run python manage.py runserver 0.0.0.0:8000
        volumes:
            - ./backend:/app
            - backend_venv:/app/.venv
            - media_volume_dev:/app/media
        ports:
            - "8000:8000"
        env_file:
            - .env
        environment:
            DJANGO_SETTINGS_MODULE: config.settings.dev
            CELERY_BROKER_URL: redis://redis:6379/0
            CELERY_RESULT_BACKEND: redis://redis:6379/0
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    celery_worker:
        build: ./backend
        entrypoint: []
        command: uv run celery -A config.settings worker -l info --concurrency=2
        volumes:
            - ./backend:/app
            - backend_venv:/app/.venv
        env_file:
            - .env
        environment:
            DJANGO_SETTINGS_MODULE: config.settings.dev
            CELERY_BROKER_URL: redis://redis:6379/0
            CELERY_RESULT_BACKEND: redis://redis:6379/0
        depends_on:
            backend:
                condition: service_started

    celery_beat:
        build: ./backend
        entrypoint: []
        command: uv run celery -A config.settings beat -l info
        volumes:
            - ./backend:/app
            - backend_venv:/app/.venv
        env_file:
            - .env
        environment:
            DJANGO_SETTINGS_MODULE: config.settings.dev
            CELERY_BROKER_URL: redis://redis:6379/0
            CELERY_RESULT_BACKEND: redis://redis:6379/0
        depends_on:
            backend:
                condition: service_started

    frontend:
        build: ./frontend
        command: yarn dev --host 0.0.0.0
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - "5173:5173"
        environment:
            VITE_API_URL: /
            VITE_PROXY_TARGET: http://backend:8000
        depends_on:
            - backend

    frontend2:
        build: ./frontend2
        command: yarn dev
        volumes:
            - ./frontend2:/app
            - frontend2_node_modules:/app/node_modules
        ports:
            - "3000:3000"
        environment:
            NEXT_PUBLIC_API_URL: /
            PROXY_TARGET: http://backend:8000
        depends_on:
            - backend

volumes:
    postgres_data_dev:
    backend_venv:
    frontend_node_modules:
    frontend2_node_modules:
    media_volume_dev:
